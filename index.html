<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23221a3a'/%3E%3Ccircle cx='8' cy='9' r='5' fill='%23f28c38'/%3E%3C/svg%3E" />
    <title>JUICED</title>
    <style>
      /* Loading screen: inline so it paints before the bundle arrives. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse at 50% 58%, #3a3437 0%, #221e23 55%, #141116 100%);
        color: #eadfcb;
        font: 13px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.03em;
        transition: opacity 450ms ease;
      }
      #boot.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot p {
        margin: 0;
        opacity: 0.82;
      }
      .boot-box {
        position: relative;
        width: 64px;
        height: 42px;
        margin-top: 16px;
        border-radius: 12px 12px 9px 9px;
        background: #e3b23c;
        box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.16), 0 10px 18px rgba(0, 0, 0, 0.35);
        animation: boot-bob 1.4s ease-in-out infinite;
      }
      .boot-box::before {
        /* handle */
        content: '';
        position: absolute;
        left: 18px;
        right: 18px;
        top: -15px;
        height: 18px;
        border: 6px solid #e3b23c;
        border-bottom: 0;
        border-radius: 10px 10px 0 0;
      }
      .boot-box::after {
        /* zipper line */
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 15px;
        height: 3px;
        background: #1c1a1d;
      }
      @keyframes boot-bob {
        50% {
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-box {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-box" aria-hidden="true"></div>
      <p>Unpacking the lunchbox…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
